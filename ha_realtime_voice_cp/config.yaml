# Home Assistant OS add-on: HA Realtime Voice control plane
# Install via public add-on repo:
#   https://github.com/colinmcintosh/ha-realtime-voice-addons
name: "HA Realtime Voice CP"
version: "0.4.0"
slug: ha_realtime_voice_cp
description: "Mints short-lived xAI realtime tokens and bootstraps Voice PE sessions. Links HA via OAuth (no long-lived token paste). Does not proxy audio."
url: "https://github.com/colinmcintosh/ha-realtime-voice"
arch:
  - aarch64
  - amd64
  - armv7
# Prebuilt images, so Supervisor PULLS instead of running a docker build on the
# user's Home Assistant host. Supervisor substitutes {arch} and appends the
# `version:` below as the tag, so the two must move together — build the images
# first, then publish. scripts/publish-addon-repo.sh refuses to publish this key
# while any arch is unpullable, because an image that does not exist makes the
# add-on uninstallable rather than merely slow (there is no build to fall back
# to). Built by .github/workflows/addon-build.yml in the monorepo.
#
# Measured cause: a from-source build took 7m07s on HA Blue and, with the host
# already at 416 MB available and swap exhausted, froze the UI for ten minutes.
image: "ghcr.io/colinmcintosh/ha-realtime-voice-cp-{arch}"
init: false
startup: application
boot: auto
# S-3: the human-facing UI (OAuth link/unlink, device enrolment, revocation)
# is served through Supervisor ingress, so Home Assistant authenticates the user
# before the request arrives. The published port stays — a Voice PE cannot log
# in to Home Assistant — but with `ui_access: ingress` it carries only
# device-authenticated endpoints plus /health.
ingress: true
ingress_port: 8787
host_network: false
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: "Device API for Voice PE (session mint + telemetry). The pairing UI is on ingress."
watchdog: "http://[HOST]:[PORT:8787]/health"
panel_icon: mdi:microphone-message
panel_title: "Voice CP"
options:
  xai_api_key: ""
  # Must be set per install. Generate with:
  #   python3 -c 'import secrets; print("voice-pe-1:" + secrets.token_urlsafe(32))'
  # A device token mints a live HA access token and a live xAI ephemeral token,
  # so a shared or guessable value is full home control for anyone on the LAN.
  device_tokens: ""
  # HA Core as seen from this add-on (HA OS default works).
  ha_base_url: "http://homeassistant:8123"
  # Only needed when ui_access is "lan" or "both". Opening the UI through
  # ingress derives the OAuth client_id and redirect from the request itself.
  public_base_url: ""
  # Where the pairing UI may be reached from:
  #   ingress - through Home Assistant only (recommended; closes S-3)
  #   lan     - on port 8787 only (standalone Docker without Supervisor)
  #   both    - transitional; any LAN host can open the UI
  ui_access: "ingress"
  # Home Assistant services the voice model may call, as comma-separated
  # domain.service patterns (domain.* is allowed). Empty = built-in allowlist
  # covering ordinary home control. Anything not listed is refused on the
  # device. A hard-deny list (shell_command, python_script, hassio, backup, …)
  # always applies and cannot be widened here.
  service_allow: ""
  service_deny: ""
  # Services that need spoken confirmation. Empty string disables the gate;
  # leave unset for the default (locks, alarm panels, cover.open_cover).
  service_confirm: "lock.unlock,lock.open,alarm_control_panel.alarm_disarm,alarm_control_panel.alarm_arm_away,alarm_control_panel.alarm_arm_home,cover.open_cover"
  # Optional spoken PIN required alongside confirmation. Digits only, "" = off.
  confirm_pin: ""
  # Which room each device is in, as device_id:Area pairs. Lets "turn on the
  # lights" mean this room instead of prompting for one every time.
  # Example: voice-pe-1:Kitchen,voice-pe-2:Bedroom
  device_areas: ""
  default_model: "grok-voice-latest"
  default_voice: "eve"
  default_sample_rate: 16000
  xai_ephemeral_ttl_seconds: 300
  log_level: info
  default_instructions: >-
    You are a concise home voice assistant for Home Assistant.
    Prefer short spoken answers.
    CRITICAL entity rules: Never invent or guess entity_ids
    (for example light.bedroom is usually wrong).
    When the user names a room or device, first call ha_search_entities
    with their words (and domain=light/switch/etc when obvious).
    Only then call ha_get_state or ha_call_service using an exact entity_id
    from the search matches. If search returns multiple lights in a room,
    summarize them or act on all relevant matches.
    If a tool returns entity_not_found, search again instead of guessing.
    If Home Assistant is unavailable, say so briefly and continue.
    Call end_conversation only when the user is clearly done
    (goodbye/thanks/that's all). That ends this conversation session
    only; the device remains available afterward.
schema:
  xai_api_key: password
  device_tokens: str
  ha_base_url: str
  public_base_url: str?
  ui_access: list(ingress|lan|both)
  service_allow: str?
  service_deny: str?
  service_confirm: str?
  confirm_pin: str?
  device_areas: str?
  default_model: str
  default_voice: str
  default_sample_rate: int(8000,48000)
  xai_ephemeral_ttl_seconds: int(60,3600)
  log_level: list(debug|info|warning|error)
  default_instructions: str
